<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf8f5" />
    <title>Video — Panda &amp; Ramen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/theme.css" />
    <link rel="stylesheet" href="../css/home.css" />
    <link rel="stylesheet" href="../css/video-page.css" />
    <link rel="stylesheet" href="../css/mobile.css" />
  </head>
  <body>
    <canvas id="snowfall-canvas" aria-hidden="true"></canvas>
    <main class="app-shell page-video">
      <a class="page-video__back" href="../index.html">← Back home</a>

      <header class="page-video__header">
        <img id="video-page-mascot" src="" alt="" />
        <h1 id="video-page-title">Birthday Note</h1>
        <p id="video-page-sub"></p>
      </header>

      <div id="video-stage" class="video-player">
        <div class="video-frame video-frame--portrait">
          <video
            id="lounge-video"
            controls
            playsinline
            preload="auto"
            controlsList="nodownload"
          ></video>
          <button type="button" id="video-play-overlay" class="video-stage__play" aria-label="Play video">
            <span class="video-stage__play-icon" aria-hidden="true">▶</span>
            <span id="video-overlay-label" class="video-stage__play-label">Play video</span>
          </button>
        </div>
        <div class="video-player__bar">
          <button type="button" id="video-play-btn" class="video-play-btn" aria-label="Play video">
            <span id="video-play-btn-icon" aria-hidden="true">▶</span>
            <span id="video-play-btn-text">Play</span>
          </button>
          <p class="video-player__hint">
            Use the built-in player bar for volume, timeline, and fullscreen.
          </p>
        </div>
      </div>

      <p id="video-page-note" class="page-video__note"></p>
    </main>
    <script src="../js/config.js"></script>
    <script src="../js/media-path.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/video-lounge.js"></script>
    <script src="../js/snowfall.js"></script>
  </body>
</html>
