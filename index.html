<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf8f5" />
    <title>The Cozy Corner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/intro.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="css/mobile.css" />
  </head>
  <body>
    <canvas id="snowfall-canvas" aria-hidden="true"></canvas>

    <div id="intro-overlay" class="intro-overlay" role="dialog" aria-modal="true" aria-label="Introduction">
      <div class="intro-inner">
        <div id="intro-video-wrap" class="intro-video-wrap" hidden>
          <video id="intro-video" playsinline preload="auto"></video>
        </div>
        <div id="intro-fallback" class="intro-fallback">
          <img id="intro-fallback-art" class="intro-fallback__art" src="" alt="" />
          <h2 id="intro-fallback-title" class="intro-fallback__title">Welcome</h2>
          <p id="intro-fallback-sub" class="intro-fallback__sub"></p>
          <p class="intro-enter-hint">Tap Skip when you're ready</p>
        </div>
        <button type="button" id="intro-skip" class="intro-skip">Skip intro</button>
      </div>
    </div>

    <div id="main-app" class="app-shell main-app is-locked">
      <header class="site-header reveal">
        <img id="header-mascot" class="site-header__mascot" src="" alt="" />
        <div class="site-header__text">
          <h1 id="site-title">The Cozy Corner</h1>
          <p id="site-tagline"></p>
        </div>
      </header>

      <section class="hero-banner">
        <div class="hero-banner__copy reveal">
          <p id="hero-subtitle"></p>
        </div>
        <img id="hero-ramen" class="hero-banner__bowl reveal" src="" alt="" />
      </section>

      <section class="nav-section" aria-labelledby="explore-label">
        <p id="explore-label" class="nav-section__label reveal">Explore</p>
        <ul id="nav-cards" class="nav-cards reveal-stagger"></ul>
      </section>

      <footer class="site-footer reveal">
        <p id="footer-note"></p>
      </footer>
    </div>

    <script src="js/config.js"></script>
    <script src="js/media-path.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/scroll-reveal.js"></script>
    <script src="js/home.js"></script>
    <script src="js/intro.js"></script>
    <script src="js/snowfall.js"></script>
  </body>
</html>
